name: check-alerts
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests firebase-admin
      - run: python checker.py
        env:
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
      - name: Save seen alerts
        run: | git config user.name "alert-bot" git config user.email "bot@users.noreply.github.com" git add seen.json git commit -m "update seen" || echo "no changes" git push
